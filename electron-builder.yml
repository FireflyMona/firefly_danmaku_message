appId: com.firefly.qqdanmaku
productName: 流萤弹幕消息
artifactName: 流萤弹幕消息.exe
directories:
  output: release
  buildResources: assets
files:
  - dist/**/*
  - renderer/**/*
  - assets/tray.png
  - assets/icon.ico
  - package.json
extraResources:
  - from: python/wechat_listener.py
    to: python/wechat_listener.py
win:
  target:
    - portable
  icon: assets/icon.ico
  signAndEditExecutable: false
portable:
  artifactName: 流萤弹幕消息.exe
asar: true
