<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>托盘菜单</title>
  <link rel="stylesheet" href="tray-menu.css" />
</head>
<body>
  <div class="menu">
    <button class="item" id="toggleBtn">
      <span id="showText" class="word show" data-i18n="tray.show">显示</span><span class="plain slash">/</span><span id="hideText" class="word hide" data-i18n="tray.hide">隐藏</span><span class="plain suffix" data-i18n="tray.danmaku">弹幕</span>
    </button>
    <div class="divider"></div>
    <button class="item" id="consoleBtn" data-i18n="tray.console">控制台</button>
    <div class="divider"></div>
    <button class="item" id="refreshBtn" data-i18n="tray.refresh">刷新</button>
    <div class="divider"></div>
    <button class="item" id="uninstallBtn" data-i18n="tray.uninstall">卸载软件</button>
    <div class="divider"></div>
    <button class="item" id="quitBtn" data-i18n="tray.quit">退出程序</button>
  </div>
  <script src="i18n.js"></script>
  <script src="tray-menu.js"></script>
</body>
</html>
