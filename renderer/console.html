<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>控制台</title>
  <link rel="stylesheet" href="console.css" />
</head>
<body>
  <main>
    <header>
      <h1 data-i18n="console.title">控制台</h1>
    </header>

    <fieldset>
      <legend data-i18n="console.section.visibility">弹幕显示</legend>
      <label class="check"><input type="checkbox" id="visibility" /> <span data-i18n="console.visibility">显示弹幕</span></label>
    </fieldset>

    <fieldset>
      <legend data-i18n="console.section.scope">消息范围</legend>
      <div class="scope-group">
        <div class="scope-head" data-i18n="tray.qq">QQ</div>
        <div class="scope-sub" data-i18n="submenu.special">特别关注</div>
        <label class="check"><input type="checkbox" id="scopeSpecialPrivate" /> <span data-i18n="common.private">私信</span></label>
        <div class="scope-sub" data-i18n="submenu.normal">普通对话</div>
        <label class="check"><input type="checkbox" id="scopeNormalPrivate" /> <span data-i18n="common.private">私信</span></label>
        <label class="check"><input type="checkbox" id="scopeNormalGroup" /> <span data-i18n="common.group">群聊</span></label>
      </div>
      <div class="scope-group">
        <div class="scope-head" data-i18n="tray.wechat">微信</div>
        <label class="check"><input type="checkbox" id="wechatPrivate" /> <span data-i18n="common.private">私信</span></label>
        <label class="check"><input type="checkbox" id="wechatGroup" /> <span data-i18n="common.group">群聊</span></label>
      </div>
    </fieldset>

    <fieldset>
      <legend data-i18n="console.section.language">语言</legend>
      <label class="check"><span data-i18n="settings.language">语言</span>
        <select id="language">
          <option value="zh">中文</option>
          <option value="en">English</option>
        </select>
      </label>
    </fieldset>

    <fieldset>
      <legend data-i18n="console.section.connectionSettings">连接设置</legend>
      <label><span data-i18n="settings.wsUrl">OneBot WebSocket 地址</span>
        <input id="wsUrl" type="text" placeholder="ws://127.0.0.1:3001" />
      </label>
      <label><span data-i18n="settings.token">Access Token（可选）</span>
        <input id="token" type="password" data-i18n-placeholder="settings.tokenPlaceholder" placeholder="留空表示无 token" />
      </label>
      <label><span data-i18n="settings.reconnectMs">断线重连间隔（毫秒）</span>
        <input id="reconnectMs" type="number" min="1000" step="500" />
      </label>
      <label class="check"><input type="checkbox" id="enableWechat" /> <span data-i18n="settings.enableWechat">启用微信消息（需微信 4.x 已登录 + Python wechatauto-replica）</span></label>
    </fieldset>

    <fieldset>
      <legend data-i18n="console.section.appearance">弹幕外观</legend>
      <div class="grid">
        <label class="color"><span data-i18n="console.bgColor">弹幕底色</span><input type="color" id="bannerBgColor" /></label>
        <label class="color"><span data-i18n="console.labelColor">来源标签颜色</span><input type="color" id="bannerLabelColor" /></label>
        <label class="color"><span data-i18n="console.nickColor">昵称颜色</span><input type="color" id="bannerNickColor" /></label>
        <label class="color"><span data-i18n="console.textColor">正文颜色</span><input type="color" id="bannerTextColor" /></label>
        <label><span data-i18n="settings.fontSize">字号（px）</span><input type="number" id="fontSize" min="10" max="40" /></label>
        <label><span data-i18n="settings.opacity">不透明度</span><input type="number" id="opacity" min="0.1" max="1" step="0.02" /></label>
        <label><span data-i18n="settings.widthPercent">弹幕宽度占比（%）</span><input type="number" id="widthPercent" min="10" max="100" /></label>
        <label><span data-i18n="settings.maxHeightPercent">弹幕高度上限（% 屏幕高）</span><input type="number" id="maxHeightPercent" min="5" max="100" /></label>
      </div>
    </fieldset>

    <fieldset>
      <legend data-i18n="console.section.timing">显示时长</legend>
      <label><span data-i18n="settings.secondsPerLine">每行停留秒数</span><input type="number" id="secondsPerLine" min="1" max="30" /></label>
    </fieldset>

    <fieldset>
      <legend data-i18n="console.section.count">同屏条数</legend>
      <label><span data-i18n="console.maxBannerCount">同屏最大条数</span><input type="number" id="maxBannerCount" min="0" max="50" step="1" /></label>
      <p class="hint" data-i18n="console.maxBannerCountHint">0 表示不限制（仅按高度排队）</p>
    </fieldset>

    <fieldset>
      <legend data-i18n="console.section.connection">连接状态</legend>
      <p id="qqConn" class="conn" data-i18n="settings.notConnected">未连接</p>
      <p id="qqAccount" class="conn" hidden></p>
      <p id="wechatConn" class="conn" data-i18n="settings.wechatDisabled">微信未启用</p>
      <p id="wechatAccount" class="conn" hidden></p>
    </fieldset>

    <footer>
      <span id="savedToast" class="toast hidden" data-i18n="settings.saved">已保存</span>
      <button id="reset" type="button" class="secondary" data-i18n="console.reset">恢复默认</button>
      <button id="save" type="button" class="primary" data-i18n="settings.save">保存设置</button>
    </footer>
  </main>
  <script src="i18n.js"></script>
  <script src="console.js"></script>
</body>
</html>
